name: wok-and-chop-development
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: wok_and_chop
      POSTGRES_USER: wok_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password in ops/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wok_dev -d wok_and_chop"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
